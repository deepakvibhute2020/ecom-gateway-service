apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecom-gateway-service
  template:
    metadata:
      labels:
        app: ecom-gateway-service
    spec:
      serviceAccountName: ecom-gateway-service
      containers:
        - name: ecom-gateway-service
          image: ecom-gateway-service:0.0.1-SNAPSHOT
          ports:
            - containerPort: 8080
          env:
            # Base64 secret; must equal the auth service's app.jwt.secret.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecom-jwt
                  key: secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
---
# Lets lb://<service-name> resolve Kubernetes Services in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecom-gateway-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecom-gateway-service
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecom-gateway-service
subjects:
  - kind: ServiceAccount
    name: ecom-gateway-service
roleRef:
  kind: Role
  name: ecom-gateway-service
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-gateway-service
spec:
  type: LoadBalancer
  selector:
    app: ecom-gateway-service
  ports:
    - port: 80
      targetPort: 8080
# Share the auth service's Base64 JWT secret: kubectl create secret generic ecom-jwt --from-literal=secret="<same Base64 value as auth service JWT_SECRET>"
# The masterdata and userauth Services must be named ecom-masterdata-service / ecom-userauth-service and be ClusterIP only (not public).
