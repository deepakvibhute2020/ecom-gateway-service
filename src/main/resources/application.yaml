server:
  port: 8090

spring:
  application:
    name: ecom-gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # lb:// resolves the logical service name via the Kubernetes service registry.
            # More specific route first: login/validate are served by the auth service.
            - id: ecom-userauth-service
              uri: lb://ecom-userauth-service
              predicates:
                - Path=/api/auth/**
            # Every other /api call is JWT-validated by the gateway (see SecurityConfig) before routing.
            - id: ecom-masterdata-service
              uri: lb://ecom-masterdata-service
              predicates:
                - Path=/api/**
    kubernetes:
      loadbalancer:
        mode: SERVICE

app:
  jwt:
    # Same Base64 secret (>= 32 bytes) and issuer the auth service signs tokens with.
    # Must be provided via a Kubernetes Secret; never commit a real value.
    secret: ${JWT_SECRET}
    issuer: ecom-userauth-service

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
