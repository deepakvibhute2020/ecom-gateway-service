server:
  port: 8089

spring:
  application:
    name: ecom-gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # lb:// resolves the logical service name via the Kubernetes service registry.
            # More specific route first: login/validate are served by the auth service.
            - id: ecom-userauth-service
              uri: lb://ecom-userauth-service
              predicates:
                - Path=/api/auth/**, /api/user-info/**
            # Serves masterdata's OpenAPI document so the gateway Swagger UI can list it (auth service is excluded).
            - id: ecom-masterdata-api-docs
              uri: lb://ecom-masterdata-service
              predicates:
                - Path=/docs/masterdata/api-docs
              filters:
                - RewritePath=/docs/masterdata/api-docs, /api-docs
            - id: ecom-userauth-api-docs
              uri: lb://ecom-userauth-service
              predicates:
                - Path=/docs/userauth/api-docs
              filters:
                - RewritePath=/docs/userauth/api-docs, /api-docs
            # Every other /api call is JWT-validated by the gateway (see SecurityConfig) before routing.
            - id: ecom-masterdata-service
              uri: lb://ecom-masterdata-service
              predicates:
                - Path=/api/**
    kubernetes:
      loadbalancer:
        mode: SERVICE

app:
  jwt:
    # Same Base64 secret (>= 32 bytes) and issuer the auth service signs tokens with.
    # Must be provided via a Kubernetes Secret; never commit a real value.
    secret: ${JWT_SECRET}
    issuer: ecom-userauth-service

springdoc:
  # Each entry is a downstream service spec routed above.
  swagger-ui:
    urls:
      - name: ecom-userauth-service
        url: /docs/userauth/api-docs
      - name: ecom-masterdata-service
        url: /docs/masterdata/api-docs
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
