name: Build ecom-gateway-service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-job:
    name: Build Job ecom-gateway-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build with Maven
        run: mvn clean install

  # Send email notification when build fails
      - name: Trigger Centralized Email Notification
        if: failure()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CICD_COMMON_TOKEN }}
          repository: deepakvibhute2020/ecom-cicd-common
          event-type: build-failure
          client-payload: |
            {
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "workflow": "${{ github.workflow }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
