name: Build ecom-gateway-service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-job:
    name: Build Job ecom-gateway-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build with Maven
        run: |
          mvn clean install
          exit 1

  # Send email notification when build fails
  notify:
    needs: build-job
    if: failure()
    uses: deepakvibhute2020/ecom-cicd-comman/.github/workflows/email-notification.yml@main
    with:
      repository: ${{ github.repository }}
      branch: ${{ github.ref_name }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      BUILD_NOTIFICATION_EMAILS: ${{ vars.BUILD_NOTIFICATION_EMAILS }}
